name: CI for linux by xmake

on:
  push:
    branches: [ "*" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/*'
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.toolchain }} ${{ matrix.mode }} ${{ matrix.backend }} ${{ matrix.kind }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # GCC 15.1-15.3 and 16.1 can skip destructors of tuple-like structured
        # bindings across coroutine suspension at -O1+, leaking owned resources.
        # https://gcc.gnu.org/bugzilla/show_bug.cgi?id=124584
        # Fixed in GCC 16.2; keep GCC 14 until CI uses a compiler with the fix.
        toolchain: [gcc-14, clang]
        mode: [release, coverage]
        backend: [epoll, io_uring]
        kind: [shared, static]

    steps:
    - uses: actions/checkout@v4

    - name: setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Install dependencies
      run: |
        PACKAGES=()
        if [ "${{ matrix.mode }}" == "coverage" ]; then
          PACKAGES+=(lcov)
          if [ "${{ matrix.toolchain }}" == "clang" ]; then
            PACKAGES+=(llvm-21)
          fi
        fi
        if [ "${{ matrix.backend }}" == "io_uring" ]; then
          PACKAGES+=(liburing-dev)
        fi
        if [ "${{ matrix.toolchain }}" == "gcc-14" ]; then
          PACKAGES+=(gcc-14 g++-14)
        fi
        if [ "${{ matrix.toolchain }}" == "clang" ]; then
          PACKAGES+=(clang-21 libclang-rt-21-dev)
        fi
        if [ "${#PACKAGES[@]}" -gt 0 ]; then
          sudo apt-get update
          sudo apt-get install -y "${PACKAGES[@]}"
        fi

    - name: Set up GCC 14
      if: matrix.toolchain == 'gcc-14'
      run: |
        gcc-14 --version
        g++-14 --version
        gcov-14 --version
        # Match Codecov's unversioned gcov command to GCC 14 coverage data.
        GCOV_BIN="$RUNNER_TEMP/gcc-14-coverage"
        mkdir -p "$GCOV_BIN"
        ln -s "$(command -v gcov-14)" "$GCOV_BIN/gcov"
        echo "$GCOV_BIN" >> "$GITHUB_PATH"

    - name: Select Clang 21
      if: matrix.toolchain == 'clang'
      run: |
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 21
        sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-21   21
        clang++ --version
        clang   --version

    - name: Set up Clang coverage
      if: matrix.toolchain == 'clang' && matrix.mode == 'coverage'
      run: |
        # Invoking llvm-cov as gcov selects its gcov-compatible mode.
        # Match Codecov's unversioned gcov command to Clang 21 coverage data.
        GCOV_BIN="$RUNNER_TEMP/clang-21-coverage"
        mkdir -p "$GCOV_BIN"
        ln -s "$(command -v llvm-cov-21)" "$GCOV_BIN/gcov"
        "$GCOV_BIN/gcov" --version
        echo "$GCOV_BIN" >> "$GITHUB_PATH"

    - name: Configure
      run: |
        CONFIG_ARGS=""
        if [ "${{ matrix.backend }}" == "io_uring" ]; then
          CONFIG_ARGS="--io_uring=y"
        fi
        
        echo "Configuring with: -m ${{ matrix.mode }} -k ${{ matrix.kind }} --toolchain=${{ matrix.toolchain }} $CONFIG_ARGS"
        
        xmake f -m ${{ matrix.mode }} -k ${{ matrix.kind }} --toolchain=${{ matrix.toolchain }} $CONFIG_ARGS --dev=y --sanitizer=y --qt_interop=y -y

    - name: Build
      run: xmake -y

    - name: Run Test
      run: xmake test -v

    - name: Upload coverage to Codecov
      if: matrix.mode == 'coverage'
      uses: codecov/codecov-action@v4
      with:
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
